<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="家庭旅行行程，一起排、一起看（需登入）" />
    <meta name="theme-color" content="#faf4e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191511" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Next Trip" />
    <!-- 加到主畫面之後全螢幕開啟（沒有網址列）。新的 iPhone 看 manifest 的 display，這兩行是給舊版看的。 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      字型：全站用圓體「Chiron GoRound TC」（昭源圓體，繁體中文，和 logo 的圓頭線條同一種感覺），從 Google Fonts 載。
      它是可變字重的一套檔案（細到粗都在裡面），而且切成一百多塊，只下載頁面上用到的字那幾塊。
      不擋住畫面：先用手機內建的字型顯示，字型到了再換上。載過之後 service worker 會留一份，沒訊號時也是圓體。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@200..900&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@200..900&display=swap" /></noscript>
    <title>Next Trip</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
