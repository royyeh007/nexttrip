<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="家庭旅行行程，一起排、一起看（需登入）" />
    <meta name="theme-color" content="#faf4e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191511" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Next Trip" />
    <!-- 加到主畫面之後全螢幕開啟（沒有網址列）。新的 iPhone 看 manifest 的 display，這兩行是給舊版看的。 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      字型：內文用手機內建的中文字型（iPhone 的蘋方、Android 的思源黑體），不下載。
      只有標題用的 Noto Serif TC 和數字用的 IBM Plex Mono 從 Google Fonts 載，而且不擋住畫面：
      先用內建字型顯示，字型到了再換上。（原本連內文的 Noto Sans TC 三個字重都下載，樣式表本身就 600 多 KB，還會擋住第一次顯示。）
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=IBM+Plex+Mono:wght@500;600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=IBM+Plex+Mono:wght@500;600&display=swap" /></noscript>
    <title>Next Trip</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
