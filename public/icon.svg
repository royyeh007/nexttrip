<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App icon 的原始檔：小行李箱和紙飛機。改完用 Chrome 轉成 icon-192.png、icon-512.png、apple-touch-icon.png。
       圖案都在中間 80% 的圓內（Android 會把圖示裁成圓形或圓角）。 -->
  <rect width="512" height="512" fill="#ffe7a8"/>
  <!-- 紙飛機飛過的虛線 -->
  <path d="M106 122 Q250 169 318 134" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-dasharray="2 20"/>
  <!-- 紙飛機：轉到機身的中線（機頭到機尾凹口）跟虛線尾端同一個方向，虛線從機尾正後方接上來 -->
  <g transform="translate(-9 -31) rotate(19 338 160)" stroke="#1b2740" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <path d="M312 138 L392 106 L364 182 L347 153 Z" fill="#fff"/>
    <path d="M347 153 L392 106" fill="none"/>
  </g>
  <!-- 行李箱 -->
  <g transform="rotate(-5 256 320)" stroke="#1b2740" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="188" cy="424" r="13" fill="#1b2740"/>
    <circle cx="324" cy="424" r="13" fill="#1b2740"/>
    <path d="M210 218 v-26 a22 22 0 0 1 22 -22 h48 a22 22 0 0 1 22 22 v26" fill="none"/>
    <rect x="138" y="218" width="236" height="196" rx="42" fill="#e9573f"/>
    <!-- 貼紙 -->
    <circle cx="186" cy="368" r="17" fill="#7cc4e8" stroke-width="8"/>
    <path d="M330 346 l7 15 16 2 -12 11 3 16 -14 -8 -14 8 3 -16 -12 -11 16 -2 z" fill="#ffd257" stroke-width="8"/>
    <!-- 臉 -->
    <g stroke="none">
      <ellipse cx="204" cy="318" rx="15" ry="10" fill="#ffab98"/>
      <ellipse cx="308" cy="318" rx="15" ry="10" fill="#ffab98"/>
      <circle cx="228" cy="296" r="10" fill="#1b2740"/>
      <circle cx="284" cy="296" r="10" fill="#1b2740"/>
    </g>
    <path d="M240 320 q16 15 32 0" fill="none" stroke-width="9"/>
  </g>
</svg>
