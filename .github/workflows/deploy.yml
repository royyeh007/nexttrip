name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 預設什麼都不給；要發佈網站的權限只給 deploy 那個 job（build 會跑 npm ci，不該拿得到）
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 有問題就不要發佈：lint、純邏輯的測試（信用卡推薦、優惠券、航班文字解析…）
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # repo Settings → Secrets and variables → Actions → Variables
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
