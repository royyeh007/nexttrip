# 每 15 分鐘叫一次 flight-refresh：新航班查一次、出發前一天查一次、當天每 12～30 分鐘更新（aviationstack 省著用）。
# 需要 repo secret FLIGHT_CRON_TOKEN（和 Supabase 的 CRON_TOKEN 相同）。
name: Refresh flight status

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# 這個 job 只打一個網址，不需要讀 repo
permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - env:
          # secret 走環境變數，不直接拼進指令字串
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          CRON_TOKEN: ${{ secrets.FLIGHT_CRON_TOKEN }}
        run: |
          curl -fsS -X POST "$SUPABASE_URL/functions/v1/flight-refresh" \
            -H "Authorization: Bearer $CRON_TOKEN" \
            -H "apikey: $ANON_KEY" \
            -H "Content-Type: application/json" -d '{}'
