# Supabase 免費方案 7 天沒有請求會自動暫停；每天打一下讓它醒著。
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          curl -fsS "$SUPABASE_URL/rest/v1/families?select=id&limit=1" \
            -H "apikey: $ANON_KEY" \
            -o /dev/null -w "supabase status %{http_code}\n"
